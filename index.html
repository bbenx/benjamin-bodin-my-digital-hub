<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Shell critique : évite fond blanc / mise en page effondrée si le CSS bundle arrive en retard -->
    <style id="critical-shell">
      html {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100%;
        background-color: hsl(0 0% 4%);
        color: hsl(40 10% 90%);
      }
      #root {
        min-height: 100%;
        width: 100%;
      }

      /* Hero statique : visible avant le chargement du JavaScript */
      #app-shell {
        box-sizing: border-box;
        display: flex;
        min-height: 100dvh;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4.5rem 1rem 2rem;
        text-align: center;
      }

      #app-shell * {
        box-sizing: border-box;
      }

      .app-shell-title {
        position: relative;
        width: 100%;
      }

      .app-shell-title span {
        display: block;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-weight: 700;
        font-size: clamp(2.5rem, 16vw, 6.25rem);
        line-height: 0.8;
        letter-spacing: -0.05em;
        color: hsl(175 35% 40%);
      }

      .app-shell-portrait {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 1;
        width: 70px;
        height: 115px;
        transform: translate(-50%, -50%);
        border-radius: 9999px;
        border: 1px solid hsl(0 0% 100% / 0.12);
        object-fit: cover;
      }

      .app-shell-tagline {
        margin: 2rem 0 0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        letter-spacing: 0.3em;
        color: hsl(0 0% 50%);
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Hero : polices minimales, non bloquantes (texte visible tout de suite) -->

      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Outfit:wght@300;400&display=swap"

    <!-- Google Analytics : après le chargement pour ne pas concurrencer le hero -->
    <script>
      window.addEventListener("load", function () {
        var id = "%VITE_GA_MEASUREMENT_ID%";
        if (!id || id.indexOf("VITE_") === 0) return;
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", id);
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(s);
      });
    </script>
