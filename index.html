    <!-- Shell critique : évite fond blanc / mise en page effondrée si le CSS bundle arrive en retard -->
    <style id="critical-shell">
      html {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100%;
        background-color: hsl(0 0% 4%);
        color: hsl(40 10% 90%);
      }
      #root {
        min-height: 100%;
        width: 100%;
      }

      /* Hero statique : visible avant le chargement du JavaScript */
      #app-shell {
        box-sizing: border-box;
        display: flex;
        min-height: 100dvh;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4.5rem 1rem 2rem;
        text-align: center;
      }

      #app-shell * {
        box-sizing: border-box;
      }

      .app-shell-title {
        position: relative;
        width: 100%;
      }

      .app-shell-title span {
        display: block;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-weight: 700;
        font-size: clamp(2.5rem, 16vw, 6.25rem);
        line-height: 0.8;
        letter-spacing: -0.05em;
        color: hsl(175 35% 40%);
      }

      .app-shell-portrait {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 1;
        width: 70px;
        height: 115px;
        transform: translate(-50%, -50%);
        border-radius: 9999px;
        border: 1px solid hsl(0 0% 100% / 0.12);
        object-fit: cover;
      }

      .app-shell-tagline {
        margin: 2rem 0 0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        letter-spacing: 0.3em;
        color: hsl(0 0% 50%);
      }

      /* Header immédiat : cliquable avant React */
      #early-chrome {
        min-height: 100dvh;
        min-height: 100vh;
      }

      .early-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        padding: 0.875rem 1rem;
      }

      .early-nav {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        max-width: 1536px;
        margin: 0 auto;
      }

      .early-menu-wrap {
        position: relative;
        justify-self: start;
      }

      .early-menu-btn {
        padding: 0.375rem;
        border: 0;
        background: transparent;
        color: hsl(0 0% 50%);
        cursor: pointer;
        touch-action: manipulation;
      }

      .early-menu-btn svg {
        display: block;
        width: 1.5rem;
        height: 1.5rem;
      }

      .early-menu-panel {
        position: absolute;
        left: 0;
        top: calc(100% + 0.5rem);
        z-index: 100;
        width: 220px;
        padding: 1rem;
        border-radius: 0.5rem;
        border: 1px solid hsl(0 0% 100% / 0.12);
        background: hsl(0 0% 4% / 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
      }

      .early-menu-panel[hidden] {
        display: none;
      }

      .early-menu-panel a {
        display: block;
        padding: 0.375rem 0.5rem;
        color: hsl(40 10% 90%);
        font: 700 1.125rem/1.2 system-ui, sans-serif;
        letter-spacing: -0.02em;
        text-decoration: none;
      }

      .early-menu-panel a:first-child {
        color: hsl(175 35% 40%);
      }

      .early-logo {
        justify-self: center;
        color: hsl(40 10% 90%);
        font: 300 1.875rem/1 Georgia, "Times New Roman", serif;
        text-decoration: none;
      }

      .early-icons {
        display: flex;
        align-items: center;
        justify-self: end;
        gap: 0;
      }

      .early-icons a {
        display: block;
        padding: 0.375rem;
        color: hsl(0 0% 50%);
      }

      .early-icons svg {
        display: block;
        width: 1.25rem;
        height: 1.25rem;
      }
    </style>

    <script>
      (function () {
        var btn = document.getElementById("early-menu-btn");
        var menu = document.getElementById("early-menu-panel");
        if (!btn || !menu) return;

        function closeMenu() {
          menu.hidden = true;
          btn.setAttribute("aria-expanded", "false");
          btn.setAttribute("aria-label", "Ouvrir le menu");
        }

        btn.addEventListener("click", function (event) {
          event.stopPropagation();
          var willOpen = menu.hidden;
          menu.hidden = !willOpen;
          btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
          btn.setAttribute("aria-label", willOpen ? "Fermer le menu" : "Ouvrir le menu");
        });

        menu.addEventListener("click", function () {
          closeMenu();
        });

        document.addEventListener("click", function (event) {
          if (menu.hidden) return;
          if (
            event.target !== btn &&
            !btn.contains(event.target) &&
            !menu.contains(event.target)
          ) {
            closeMenu();
          }
        });
      })();
    </script>
